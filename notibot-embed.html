<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>White Box — AB Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
:root{--bg:#0f0f0f;--bg-2:#161616;--bg-3:#1e1e1e;--surface:#242424;--border:rgba(255,255,255,0.08);--border-2:rgba(255,255,255,0.14);--text:#f0f0f0;--text-2:#c0c0c0;--muted:#717171;--accent:#c9a96e;--accent-2:#b8963d;--good:#4ade80;--warn:#fb923c;--radius:18px;--radius-sm:12px;--shadow:0 2px 24px rgba(0,0,0,0.5);--shadow-gold:0 0 32px rgba(201,169,110,0.15)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.6;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes goldShine{0%{background-position:-200% center}100%{background-position:200% center}}
.fade-in{animation:fadeIn .45s ease forwards}
.card{background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.divider{height:1px;background:var(--border);margin:16px 0}
.btn-primary{display:block;width:100%;padding:16px 24px;background:var(--accent);color:#0f0f0f;font-size:15px;font-weight:700;border:none;border-radius:var(--radius-sm);cursor:pointer;text-align:center;letter-spacing:.01em;transition:transform .12s,opacity .12s,background .15s,box-shadow .2s}
.btn-primary:hover{background:var(--accent-2);box-shadow:var(--shadow-gold)}
.btn-primary:active{transform:scale(.97);opacity:.92}
.btn-press{transition:transform .1s ease,opacity .1s ease;cursor:pointer}
.btn-press:active{transform:scale(.96);opacity:.8}
.landing-wrap{max-width:480px;margin:0 auto}
.section{padding:32px 16px}
.section-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.section-title{font-size:22px;font-weight:800;color:var(--text);line-height:1.25;margin:0 0 6px}
.section-subtitle{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 20px}
/* HERO */
.hero-section{position:relative;overflow:hidden;min-height:560px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 32px}
.hero-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=900&q=80') center/cover no-repeat;filter:brightness(.28) saturate(.7);z-index:0}
.hero-bg-overlay{position:absolute;inset:0;background:linear-gradient(to top,#0f0f0f 35%,rgba(15,15,15,.4) 100%);z-index:1}
.hero-content{position:relative;z-index:2;padding:0 16px}
.hero-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(201,169,110,.3);background:rgba(201,169,110,.08);border-radius:99px;padding:5px 13px;margin-bottom:18px}
.hero-badge-dot{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 2s ease infinite}
.hero-title{font-size:28px;font-weight:800;line-height:1.2;color:#fff;margin:0 0 10px}
.hero-title em{font-style:normal;color:transparent;background:linear-gradient(90deg,var(--accent),#e8c98a,var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;animation:goldShine 3.5s linear infinite}
.hero-sub{font-size:14px;color:var(--text-2);line-height:1.65;margin:0 0 8px}
.hero-topics{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 24px}
.hero-topic{font-size:12px;font-weight:500;color:var(--accent);border:1px solid rgba(201,169,110,.25);background:rgba(201,169,110,.07);border-radius:8px;padding:4px 10px}
.hero-cta-btn{font-size:16px;padding:17px 24px;letter-spacing:.02em}
.hero-cta-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
/* IMAGE BLOCK */
.video-section{padding:0 16px 32px}
.image-placeholder-wrap{position:relative;border-radius:var(--radius);overflow:hidden;border:1px dashed var(--border-2);background:var(--bg-3);min-height:200px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.placeholder-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:var(--radius)}
.placeholder-label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:24px;font-size:13px;color:var(--muted);line-height:1.5;pointer-events:none;user-select:none}
/* SITUATION */
.situation-card{padding:20px}
.situation-quote{font-size:15px;font-style:italic;font-weight:500;color:var(--text-2);line-height:1.65;border-left:3px solid var(--accent);padding-left:14px;margin-bottom:14px}
.situation-text{font-size:14px;color:var(--muted);line-height:1.6}
.situation-items{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.situation-item{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text-2)}
.situation-icon{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--good)}
/* ZONES */
.zones-grid{display:flex;flex-direction:column;gap:10px}
.zone-card{padding:16px;display:flex;gap:14px;align-items:flex-start;transition:border-color .2s,box-shadow .2s}
.zone-card:hover{border-color:rgba(201,169,110,.35);box-shadow:var(--shadow-gold)}
.zone-icon-wrap{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:rgba(201,169,110,.1);border:1px solid rgba(201,169,110,.2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.zone-num{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--accent);margin-bottom:3px}
.zone-title{font-size:15px;font-weight:700;color:var(--text);margin:0 0 5px}
.zone-desc{font-size:13px;color:var(--muted);line-height:1.5}
.zone-tip{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;font-weight:600;color:var(--accent);background:rgba(201,169,110,.08);border-radius:99px;padding:3px 9px}
/* RESULTS */
.results-card{display:flex;flex-direction:column;gap:0;padding:20px}
.result-icon-wrap{width:32px;height:32px;background:rgba(201,169,110,.1);border:1px solid rgba(201,169,110,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.result-item-title{font-size:14px;font-weight:600;color:var(--text);margin:0 0 2px}
.result-item-desc{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
/* STEPS */
.steps-list{display:flex;flex-direction:column;gap:0}
.step-item{display:flex;gap:14px}
.step-line-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.step-circle{width:38px;height:38px;flex-shrink:0;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0f0f0f;box-shadow:0 0 0 5px rgba(201,169,110,.12)}
.step-connector{width:2px;flex:1;min-height:20px;background:linear-gradient(to bottom,var(--accent),var(--border));margin:4px 0}
.step-content{padding-bottom:22px}
.step-num{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--accent);margin-bottom:2px}
.step-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px}
.step-desc{font-size:13px;color:var(--muted);line-height:1.45}
/* EXPERT */
.expert-card{padding:0;overflow:hidden}
.expert-photo-wrap{width:100%;height:220px;overflow:hidden;position:relative}
.expert-photo{width:100%;height:100%;object-fit:cover;object-position:top center;filter:brightness(.85) contrast(1.05);display:block}
.expert-photo-overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--bg-3) 0%,transparent 60%)}
.expert-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-3)}
.expert-body{padding:16px 18px 18px}
.expert-name{font-size:20px;font-weight:800;color:var(--text);margin-bottom:3px}
.expert-role{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em;margin-bottom:12px}
.expert-stats{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.expert-stat{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-2);line-height:1.4}
.expert-stat-bullet{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px}
.expert-stat strong{text-decoration:none;color:var(--accent);font-weight:700}
.expert-media{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.expert-media-btn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--border-2);background:var(--surface);border-radius:8px;padding:6px 12px;text-decoration:none;transition:border-color .15s,color .15s,background .15s}
.expert-media-btn--tg{color:#2aabee;border-color:rgba(42,171,238,.3)}
.expert-media-btn--tg:hover{background:rgba(42,171,238,.1);border-color:#2aabee}
.expert-media-btn--yt{color:#ff4444;border-color:rgba(255,68,68,.3)}
.expert-media-btn--yt:hover{background:rgba(255,68,68,.08);border-color:#ff4444}
/* FOR WHOM */
.whom-grid{display:flex;flex-direction:column;gap:10px}
.whom-card{padding:16px}
.whom-card--for{border-left:3px solid var(--accent)}
.whom-card--not{border-left:3px solid var(--border-2)}
.whom-card-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.whom-card-label--not{color:var(--muted)}
.whom-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.whom-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-2);line-height:1.4}
.whom-icon{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.whom-icon--for{color:var(--accent)}
.whom-icon--not{color:var(--muted)}
/* PRICING */
.pricing-card{padding:22px;border:1px solid rgba(201,169,110,.35);margin-bottom:12px;position:relative;overflow:hidden}
.pricing-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.pricing-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#0f0f0f;background:var(--accent);border-radius:99px;padding:4px 12px;margin-bottom:14px}
.pricing-name{font-size:24px;font-weight:800;color:var(--text);margin-bottom:3px}
.pricing-tagline{font-size:13px;color:var(--muted);line-height:1.4}
.pricing-includes{display:flex;flex-direction:column;gap:9px}
.pricing-include-item{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--text-2);line-height:1.4}
.pricing-check-icon{width:15px;height:15px;color:var(--accent);flex-shrink:0;margin-top:1px}
.pricing-price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:18px}
.pricing-price{font-size:40px;font-weight:800;color:var(--accent)}
.pricing-currency{font-size:24px}
.pricing-price-note{font-size:12px;color:var(--muted)}
.pricing-btn{font-size:16px;padding:17px 24px;letter-spacing:.02em}
.pricing-guarantee{text-align:center;font-size:11px;color:var(--muted);margin:10px 0 0}
.pricing-note{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.55;padding:0 4px}
.pricing-note p{margin:0}
/* FAQ */
.faq-list{display:flex;flex-direction:column;gap:8px}
.faq-item{background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:border-color .2s}
.faq-item:has(.faq-chevron--open){border-color:rgba(201,169,110,.3)}
.faq-question{width:100%;padding:14px 16px;background:none;border:none;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:500;color:var(--text);line-height:1.4;cursor:pointer}
.faq-chevron{flex-shrink:0;color:var(--muted);transition:transform .25s ease}
.faq-chevron--open{transform:rotate(180deg);color:var(--accent)}
.faq-answer{padding:0 16px 14px;font-size:13px;color:var(--muted);line-height:1.6}
.faq-answer p{margin:0}
/* FINAL CTA */
.final-cta-section{position:relative;overflow:hidden;padding:48px 20px 52px;text-align:center}
.final-cta-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1600585154526-990dced4db0d?w=900&q=70') center/cover no-repeat;filter:brightness(.15) saturate(.5)}
.final-cta-overlay{position:absolute;inset:0;background:linear-gradient(160deg,rgba(201,169,110,.15),transparent)}
.final-cta-inner{position:relative;z-index:1;max-width:420px;margin:0 auto}
.final-cta-title{font-size:24px;font-weight:800;color:#fff;line-height:1.25;margin:0 0 14px}
.final-cta-title em{font-style:normal;color:var(--accent)}
.final-cta-text{font-size:14px;color:rgba(255,255,255,.7);line-height:1.65;margin:0 0 28px}
.final-cta-btn{background:var(--accent);color:#0f0f0f;font-size:16px;padding:17px 24px;letter-spacing:.02em}
.final-cta-hint{font-size:11px;color:rgba(255,255,255,.45);margin:10px 0 0}
/* FOOTER */
.footer-section{background:var(--bg);border-top:1px solid var(--border);padding:40px 20px 32px;text-align:center}
.footer-name{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:4px}
.footer-role{font-size:13px;color:var(--muted);margin-bottom:16px}
.footer-divider{width:40px;height:1px;background:var(--border-2);margin:0 auto 16px}
.footer-quote{font-size:14px;font-style:italic;color:var(--text-2);line-height:1.65;margin:0 0 20px}
.footer-copy{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
/* utils */
.flex{display:flex}.items-start{align-items:flex-start}.gap-4{gap:16px}
.flex-1{flex:1}.min-w-0{min-width:0}.shrink-0{flex-shrink:0}
.w-3{width:12px}.h-3{height:12px}.w-4{width:16px}.h-4{height:16px}
.w-5{width:20px}.h-5{height:20px}.w-10{width:40px}.h-10{height:40px}
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════════
// WHITE BOX · AB STUDIO · notibot-embed.html
// Все изображения — абсолютные URL (GitHub Pages)
// ═══════════════════════════════════════════════

// Базовый URL для картинок (GitHub Pages)
var IMG = 'https://studiolencha-png.github.io/project-Vibe-AB/assets/images/';

var SVG_TG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
var SVG_YT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>';

function toggleFaq(i) {
  var a=document.getElementById('faq-answer-'+i), c=document.getElementById('faq-chevron-'+i);
  if(!a)return; var o=!a.hidden; a.hidden=o;
  if(a.previousElementSibling)a.previousElementSibling.setAttribute('aria-expanded',String(!o));
  if(c)c.classList.toggle('faq-chevron--open',!o);
}
function ic(n,c){return '<i data-lucide="'+n+'" class="'+(c||'')+'"></i>'}

var ZONES=[
  {icon:'layout-panel-left',num:'01',title:'Стены',desc:'Что действительно влияет на качество всей последующей отделки. Как понять, где нужно вмешаться до начала чистовой.',tip:'Экономия на стенах обходится дороже всего'},
  {icon:'wind',num:'02',title:'Окна',desc:'Что такое правильная установка и нужно ли менять окна от застройщика. Как избежать холода, сквозняков и конденсата.',tip:'Часто менять не нужно — нужно правильно настроить'},
  {icon:'thermometer',num:'03',title:'Отопление',desc:'Возможен ли в квартире комфорт как в коттедже. Что проверить и что можно улучшить без полной замены системы.',tip:'Небольшие вложения — заметная разница'},
  {icon:'square-stack',num:'04',title:'Полы',desc:'Как исправить полусухую стяжку от застройщика и что выбрать: ламинат, кварцвинил или другое покрытие без порожков.',tip:'Ровный пол — основа всего последующего ремонта'},
  {icon:'zap',num:'05',title:'Электрика',desc:'Как сэкономить без угрозы для жизни. Что можно оставить, что стоит проверить и где нельзя экономить никогда.',tip:'Грамотная электрика — это безопасность'},
  {icon:'droplets',num:'06',title:'Коммуникации · Водоснабжение',desc:'Как не затопить соседей и не слить весь бюджет. Что проверить в трубах и стояках до начала финишной отделки.',tip:'Проверьте до чистовой — после будет дороже'}
];
var RESULTS=[
  {icon:'check-square',title:'Поймёте, что улучшить в первую очередь',desc:'Конкретные зоны и узлы — по каждой теме из разбора'},
  {icon:'thumbs-up',title:'Узнаете, что можно оставить от застройщика',desc:'Без лишних переделок и трат на ненужные работы'},
  {icon:'banknote',title:'Поймёте, где экономия разумна',desc:'Где можно сэкономить без потери качества'},
  {icon:'shield-check',title:'Узнаете, где нельзя экономить никогда',desc:'Электрика, коммуникации — зоны безопасности'},
  {icon:'calendar',title:'Сможете планировать этапы',desc:'Понятная последовательность: что и когда делать'}
];
var STEPS=[
  {num:'1',icon:'credit-card',title:'Оплачиваете',desc:'Доступ открывается сразу после оплаты'},
  {num:'2',icon:'play-circle',title:'Проходите разбор',desc:'Смотрите зоны по каждому узлу White Box'},
  {num:'3',icon:'map',title:'Видите зоны риска',desc:'Получаете ясность по конкретным узлам вашей квартиры'},
  {num:'4',icon:'check-circle',title:'Принимаете решение',desc:'Понимаете, что оставить, проверить, переделать'},
  {num:'5',icon:'arrow-right-circle',title:'Начинаете осознанно',desc:'Не вслепую, а с пониманием того, что у вас сделано'}
];
var FOR_WHOM=['Получили ключи с White Box или квартирой с черновой отделкой','Готовитесь начать чистовую отделку','Хотите улучшить результат без больших вложений','Хотите понять, что оставить от застройщика','Не хотите платить за ремонт дважды'];
var NOT_FOR_WHOM=['Ищете гарантию идеального результата без вложений','Хотите просто посмотреть красивое видео','Не готовы принимать решения по результатам разбора'];
var FAQ=[
  {q:'Может, у меня всё нормально?',a:'Может быть — и это хороший вариант. Задача проверки как раз в том, чтобы подтвердить: всё нормально и можно двигаться дальше.'},
  {q:'Зачем платить, если я сам посмотрю?',a:'Посмотреть можно. Сложнее — понять, что именно смотреть, как оценить и что из этого относится к вашей ситуации.'},
